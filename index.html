.t-faces{background:linear-gradient(135deg,#ff7eb3,#e84393)}.t-cards{background:linear-gradient(135deg,#4facfe,#0984e3)}.t-images{background:linear-gradient(135deg,#ffb36b,#e17055)}
.gp{margin-bottom:12px}

.gh span:first-child{flex:1}.chev{font-style:normal;font-size:22px;color:var(--mut);transition:transform .2s}.gh.open .chev{transform:rotate(90deg)}
.gb[hidden]{display:none}
.pi{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block}
.em img{width:46px;height:46px;object-fit:cover;border-radius:10px;display:block}.em:has(img){padding:4px}
.dt{display:inline-block;padding:3px;border-radius:12px;vertical-align:middle}.dt .pi{width:44px;height:44px;border-radius:9px}
.th{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.tw{position:relative;width:64px;height:64px}
.tw img{width:100%;height:100%;object-fit:cover;border-radius:12px}

.fc{perspective:900px;margin:14px 0;cursor:pointer}
.fcs{position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}.fcs.on{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;display:grid;place-items:center;padding:22px;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font:600 22px/1.3 var(--f);text-align:center;word-break:break-word;border:1px solid var(--line);box-shadow:0 24px 40px -22px #000}
.ff{background:linear-gradient(135deg,#8b7bff66,#5236e044)}.fb{background:linear-gradient(135deg,#3ddc9755,#13a37a33);transform:rotateY(180deg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{background:#8b7bff33;border:1px solid #8b7bff88;border-radius:12px;padding:5px 10px;font:600 12px var(--f);white-space:nowrap}
.t-deck{background:linear-gradient(135deg,#a29bfe,#6c5ce7 60%,#fd79a8)}
</style></head>

 <label>Nomi</label><input id="ti" value="${E?esc(ex.title):''}" placeholder="Masalan: Hayvonlar">
 <label>Guruh</label><select id="gr">${gs.map(g=>`<option ${g===dg?'selected':''}>${esc(g)}</option>`).join('')}<option value="__new">＋ Yangi guruh…</option></select><input id="gn" placeholder="Yangi guruh nomi" style="display:none">
 <label>Daraja (1–5)</label><input id="lv" type="number" min="1" max="5" value="${E?ex.level||1:1}">
 <label>Yodlash vaqti (soniya)</label><input id="se" type="number" min="3" value="${E?d.seconds||15:15}">
 <label id="lb"></label><textarea id="dt">${esc(val)}</textarea>
 <div id="pcw" style="display:none"><label>O‘z rasmlaringiz (ixtiyoriy, 16 tagacha)</label><input id="pf" type="file" accept="image/*" multiple><div class="th" id="th"></div><div class="mut" id="pn" style="margin-top:6px"></div><div class="hint">Rasmlar kichraytirilib bazada saqlanadi (bepul). Rasm qo‘shmasangiz, emoji ishlatiladi.</div></div>
 <div class="hint" id="hn"></div><button class="btn" id="sv">${E?'O‘zgarishlarni saqlash':'Saqlash'}</button>${E?'<button class="btn d" id="dl">Mashqni o‘chirish</button>':''}`;
 bindBack();
 const upd=()=>{const t=$('#ty').value;$('#lb').textContent={deck:'Kartalar (har qatorda: savol=javob)',faces:'Yuzlar soni (2–12)',cards:'Kartalar soni (2–26)',images:'Rasmlar soni (2–12)',num:'Raqamlar soni',words:'So‘zlar (vergul bilan)',pairs:'Juftliklar (har qatorda: so‘z=javob)'}[t];
  $('#hn').textContent={deck:'Kamida 2 qator. Masalan: Italiya=Rim',faces:'Yuz va ismlar tasodifiy yaratiladi. Masalan: 5',cards:'Kartalar tasodifiy olinadi. Masalan: 7',images:'Rasmlar tasodifiy olinadi. Masalan: 6',num:'Raqamlar tasodifiy yaratiladi. Masalan: 8',words:'Kamida 3 ta so‘z: it, mushuk, ot, sigir',pairs:'Kamida 4 qator: Italiya=Rim'}[t];$('#dt').rows=['words','pairs','deck'].includes(t)?6:1};
 const th=()=>{$('#th').innerHTML=pics.map((x,i)=>`<div class="tw"><img alt="" src="${x}"><button type="button" data-x="${i}">×</button></div>`).join('');$('#pn').textContent=pics.length?`${pics.length} ta rasm · ${Math.round(pics.reduce((a,b)=>a+b.length,0)/1024)} KB`:'';$('#th').querySelectorAll('button').forEach(b=>b.onclick=()=>{pics.splice(+b.dataset.x,1);th()})};
 $('#pf').onchange=async e=>{for(const f of e.target.files){if(pics.length>=16){toast('Ko‘pi bilan 16 ta rasm',1);break}try{pics.push(await shrink(f))}catch(_){toast('Rasm o‘qilmadi',1)}}e.target.value='';th()};th();
 const vis=()=>{$('#pcw').style.display=$('#ty').value==='images'?'block':'none';if(!touched&&!E)$('#gr').value=GN[$('#ty').value]};
 $('#gr').onchange=()=>{touched=1;$('#gn').style.display=$('#gr').value==='__new'?'block':'none'};
 $('#ty').onchange=()=>{upd();vis()};upd();vis();
 $('#sv').onclick=async()=>{
  const t=$('#ty').value,raw=$('#dt').value.trim(),title=$('#ti').value.trim(),seconds=+$('#se').value||10;let data;
  if(!title)return toast('Nomini yozing',1);
  if(['faces','cards','images'].includes(t)){const mx={faces:12,cards:26,images:12}[t],n=parseInt(raw);if(!(n>=2&&n<=mx))return toast('Soni 2–'+mx,1);data={count:n,seconds};
   if(t==='images'&&pics.length){if(pics.length<n)return toast('Rasmlar soni '+n+' tadan kam bo‘lmasin',1);if(pics.reduce((a,b)=>a+b.length,0)>900000)return toast('Rasmlar hajmi katta, kamroq rasm tanlang',1);data.pics=pics}}
  else if(t==='num'){const n=parseInt(raw);if(!(n>=2&&n<=30))return toast('Raqamlar soni 2–30',1);data={digits:n,seconds}}
  else if(t==='words'){const w=raw.split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean);if(w.length<3)return toast('Kamida 3 ta so‘z',1);data={words:w,seconds}}
  else{const p=raw.split('\n').map(l=>l.split('=').map(x=>x.trim())).filter(x=>x.length===2&&x[0]&&x[1]);if(p.length<(t==='deck'?2:4))return toast('Kamida '+(t==='deck'?2:4)+' ta qator',1);data={pairs:p,seconds}}
  const gv=$('#gr').value==='__new'?$('#gn').value.trim():$('#gr').value;if(!gv)return toast('Guruh nomini yozing',1);
  const doc={group:gv,type:t,title,level:Math.min(5,Math.max(1,+$('#lv').value||1)),data,order:E?ex.order:Date.now()};
  try{
   if(E){
    if(db)await db.collection('exercises').doc(ex.id).set(toFS(doc));
    else{LS('mx',(LS('mx')||[]).map(x=>x.id===ex.id?{...doc,id:ex.id}:x))}
    Object.assign(ex,doc);
   }else{
    if(db){const r=await db.collection('exercises').add(toFS(doc));doc.id=r.id}
    else{doc.id='c'+doc.order;LS('mx',(LS('mx')||[]).concat(doc))}
    EX.push(doc);
   }
   toast('Saqlandi ✓');home();
  }catch(e){toast('Xato: Firestore qoidalarini tekshiring',1)}
 };
 const dl=$('#dl');if(dl)dl.onclick=async()=>{
  if(!confirm('Bu mashq o‘chirilsin?'))return;
  try{
   if(db)await db.collection('exercises').doc(ex.id).delete();else LS('mx',(LS('mx')||[]).filter(x=>x.id!==ex.id));
   EX.splice(EX.indexOf(ex),1);toast('O‘chirildi');home();
  }catch(e){toast('O‘chirib bo‘lmadi',1)}
 };
}
function toast(m,bad){const d=document.createElement('div');d.className='toast';if(bad)d.style.background='var(--red)';d.textContent=m;document.body.append(d);hap(bad?'error':'success');setTimeout(()=>d.remove(),2200)}

A.innerHTML='<div class="stage mut">Yuklanmoqda…</div>';
load().then(home);
</script></body></html>
